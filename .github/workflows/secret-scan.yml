name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' 'gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan all history with redacted output
        shell: bash
        run: |
          set -euo pipefail
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-defaults.toml"
          touch "$RUNNER_TEMP/gitleaks-empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --log-opts=--all \
            --config "$RUNNER_TEMP/gitleaks-defaults.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-empty.ignore" \
            --ignore-gitleaks-allow \
            --max-archive-depth=3 \
            --redact=100 --no-banner --no-color
